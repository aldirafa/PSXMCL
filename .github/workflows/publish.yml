name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2 # Fixed deprecation warning

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.0 # Fixed deprecation warning
        with:
          dotnet-version: '10.0.x' # Updated to match your net10.0 TargetFramework

      - name: Build Project
        run: dotnet build --configuration Release

      - name: Pack Library
        run: dotnet pack --configuration Release --no-build

      - name: Publish to NuGet
        # Using a recursive wildcard (**) finds the package no matter what folder net10.0 is in
        run: dotnet nuget push "**/*.nupkg" --source https://api.nuget.org/v3/index.json